[PHP]
extension_dir = "${RASPBERRY_PHP_DIR}"
extension = php_openssl.dll
extension = php_webrtc.dll

date.timezone = UTC
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
memory_limit = 512M
allow_url_fopen = On

[openssl]
openssl.cafile = "${RASPBERRY_PHP_DIR}/extras/ssl/cacert.pem"